services:
  - type: web
    name: aura-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
    healthCheckPath: /health
    autoDeploy: true